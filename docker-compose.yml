version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_DB: appliancemgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    container_name: appliancemgmt-backend

    ports:
      - "8080:8080"

    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: appliancemgmt
      PGUSER: postgres
      PGPASSWORD: password

    depends_on:
      - postgres

volumes:
  postgres_data: